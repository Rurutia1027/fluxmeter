apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: fluxmeter
  labels:
    app.kubernetes.io/part-of: fluxmeter
    app.kubernetes.io/component: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yml

    scrape_configs:
      # --- Platform exporters (always on with this kustomize) ---
      - job_name: redis
        static_configs:
          - targets: ["redis-exporter:9121"]
            labels:
              component: redis

      - job_name: kafka
        static_configs:
          - targets: ["kafka-exporter:9308"]
            labels:
              component: kafka

      - job_name: clickhouse
        static_configs:
          - targets: ["clickhouse:9363"]
            labels:
              component: clickhouse

      # --- Flink Prometheus reporter on :9249 ---
      - job_name: flink
        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names: [fluxmeter]
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_container_port_number]
            regex: "9249"
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            target_label: __address__
            replacement: $1:9249
          - source_labels: [__meta_kubernetes_pod_name]
            target_label: pod
          - source_labels: [__meta_kubernetes_pod_label_component]
            target_label: flink_component

      - job_name: prometheus
        static_configs:
          - targets: ["localhost:9090"]
            labels:
              component: prometheus
  rules.yml: |
    groups:
      - name: fluxmeter-platform
        rules:
          - alert: FluxMeterRedisDown
            expr: up{job="redis"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Redis exporter / Redis unreachable"
          - alert: FluxMeterKafkaDown
            expr: up{job="kafka"} == 0
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Kafka exporter unreachable (brokers may be down)"
          - alert: FluxMeterClickHouseDown
            expr: up{job="clickhouse"} == 0
            for: 5m
            labels:
              severity: info
            annotations:
              summary: "ClickHouse /metrics unreachable (ignore if CH not deployed)"
          - alert: FluxMeterFlinkDown
            expr: sum(up{job="flink"}) == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Flink metrics scraped but all targets down (or no JM/TM yet)"
