# Flink native K8s needs the job ServiceAccount to watch/create TM pods.
# Without this, JM logs: GET .../pods?watch=true → Forbidden (403)
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
  namespace: fluxmeter
  labels:
    app.kubernetes.io/part-of: fluxmeter
    app.kubernetes.io/component: flink
rules:
  - apiGroups: [ "" ]
    resources: [ "pods", "configmaps", "services" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
  - apiGroups: [ "apps" ]
    resources: [ "deployments", "deployments/finalizers" ]
    verbs: [ "create", "get", "list", "watch", "update", "patch", "delete" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink
  namespace: fluxmeter
  labels:
    app.kubernetes.io/part-of: fluxmeter
    app.kubernetes.io/component: flink
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: fluxmeter
