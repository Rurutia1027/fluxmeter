apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: fluxmeter
  labels:
    app.kubernetes.io/part-of: fluxmeter
    app.kubernetes.io/component: redis
spec:
  type: ClusterIP
  # Keep single write endpoint for JedisPool / API / Flink sinks.
  # Primary is always redis-0 in this StatefulSet topology.
  selector:
    app: redis
    statefulset.kubernetes.io/pod-name: redis-0
  ports:
    - name: redis
      port: 6379
      targetPort: redis
