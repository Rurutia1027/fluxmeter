# Form a 3-primary Redis Cluster after StatefulSet pods are Ready.
# Idempotent enough for kind: re-run fails safely if cluster already exists.
apiVersion: batch/v1
kind: Job
metadata:
  name: redis-cluster-init
  namespace: fluxmeter
  labels:
    app.kubernetes.io/part-of: fluxmeter
    app.kubernetes.io/component: redis
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fluxmeter
        app.kubernetes.io/component: redis
    spec:
      restartPolicy: OnFailure
      containers:
        - name: redis-cluster-init
          image: redis:7-alpine
          command:
            - /bin/sh
            - -ec
            - |
              set -eu
              NODES="\
              redis-0.redis-headless.fluxmeter.svc.cluster.local:6379 \
              redis-1.redis-headless.fluxmeter.svc.cluster.local:6379 \
              redis-2.redis-headless.fluxmeter.svc.cluster.local:6379"

              echo "Waiting for Redis pods..."
              for host in \
                redis-0.redis-headless.fluxmeter.svc.cluster.local \
                redis-1.redis-headless.fluxmeter.svc.cluster.local \
                redis-2.redis-headless.fluxmeter.svc.cluster.local
              do
                until redis-cli -h "$host" ping | grep -q PONG; do
                  echo "  still waiting for $host"
                  sleep 2
                done
              done

              # Already clustered?
              if redis-cli -h redis-0.redis-headless.fluxmeter.svc.cluster.local cluster info 2>/dev/null \
                | grep -q 'cluster_state:ok'; then
                echo "Redis cluster already healthy — skip create"
                exit 0
              fi

              echo "Creating Redis Cluster (3 primaries, 0 replicas)..."
              redis-cli --cluster create $NODES --cluster-replicas 0 --cluster-yes

              redis-cli -h redis-0.redis-headless.fluxmeter.svc.cluster.local cluster info
              echo "Redis cluster init done"
